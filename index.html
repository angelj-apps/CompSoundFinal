<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      GitHub Pages serves this repo from / (root) and cannot run server.js,
      so send visitors to the static app that Express serves locally from public/.
    -->
    <meta http-equiv="refresh" content="0; url=./public/" />
    <link rel="canonical" href="./public/" />
    <title>Garden Groovebox</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #12100e;
        color: #f2ebe3;
        font-family: ui-monospace, monospace;
      }

      a {
        color: #e8a54b;
      }
    </style>
  </head>
  <body>
    <p><a href="./public/">Garden Groovebox</a></p>
  </body>
</html>
